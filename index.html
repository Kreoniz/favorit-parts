<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Apply the stored or system theme before styles and React paint the page.
      (() => {
        let mode = 'dark';
        try {
          const saved = localStorage.getItem('favorit-parts-theme');
          if (['auto', 'light', 'dark'].includes(saved)) mode = saved;
        } catch {}
        const resolved = mode === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : mode;
        document.documentElement.dataset.bsTheme = resolved;
        document.documentElement.dataset.themePreference = mode;
        document.querySelector('meta[name="theme-color"]').content = resolved === 'dark' ? '#18181b' : '#ffffff';
      })();
    </script>
    <meta name="description" content="Поиск автозапчастей по артикулу: производители, аналоги, цены и наличие на складах Favorit Parts." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Тестовое</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Для поиска запчастей включите JavaScript в настройках браузера.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
