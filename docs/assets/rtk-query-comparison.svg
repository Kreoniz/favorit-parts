<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 284" role="img" aria-labelledby="title desc"><title id="title">Размер JavaScript до и после удаления RTK Query</title><desc id="desc">Gzip: 102,75 КБ до, 86,51 КБ после. Экономия 16,24 КБ.</desc><rect width="920" height="284" rx="12" fill="#18181b"/><style>text{font-family:system-ui,sans-serif;fill:#e4e4e7}.title{font-size:21px;font-weight:600}.label{font-size:18px}.note{font-size:15px;fill:#a1a1aa}</style><g transform="translate(32,0)"><text y="40" class="title">JavaScript, минификация</text><text y="82" class="label">С RTK Query<tspan x="380" text-anchor="end">322,37 КБ</tspan></text><rect y="96" width="380" height="24" rx="4" fill="#3f3f46"/><rect y="96" width="380.00" height="24" rx="4" fill="#a1a1aa"/><text y="164" class="label">Redux + fetch<tspan x="380" text-anchor="end">270,53 КБ</tspan></text><rect y="178" width="380" height="24" rx="4" fill="#3f3f46"/><rect y="178" width="318.89" height="24" rx="4" fill="#a370f7"/></g><g transform="translate(476,0)"><text y="40" class="title">JavaScript, gzip</text><text y="82" class="label">С RTK Query<tspan x="380" text-anchor="end">102,75 КБ</tspan></text><rect y="96" width="380" height="24" rx="4" fill="#3f3f46"/><rect y="96" width="380.00" height="24" rx="4" fill="#a1a1aa"/><text y="164" class="label">Redux + fetch<tspan x="380" text-anchor="end">86,51 КБ</tspan></text><rect y="178" width="380" height="24" rx="4" fill="#3f3f46"/><rect y="178" width="319.96" height="24" rx="4" fill="#a370f7"/></g><text x="32" y="242" class="note">CSS не изменился: 14,37 КБ gzip. Redux сохранён, кеш RTK Query удалён.</text><text x="32" y="268" class="note">1 КБ = 1000 байт. Одинаковые версии зависимостей и настройки Vite. Шкалы независимы.</text></svg>
